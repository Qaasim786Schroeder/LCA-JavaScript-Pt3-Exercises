<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Profile Card</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
      }

      /* Task 1: Main profile card container */
      #profileCard {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        text-align: center;
        width: 300px;
        transition: all 0.3s ease;
      }

      #profileImage {
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
      }

      button {
        margin: 5px;
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        font-size: 0.9rem;
      }

      button:hover {
        background-color: #0056b3;
      }

      /* Task 3: Active status styling */
      #profileCard.active-status {
        background-color: #e3f2fd;
        border: 2px solid #2196f3;
        transform: scale(1.02);
      }
    </style>
  </head>
  <body>
    <div id="profileCard">
      <img
        id="profileImage"
        src="https://placehold.co/100x100"
        alt="Profile Picture"
      />
      <h2 id="profileName">John Doe</h2>
      <p id="profileRole">Software Developer</p>
      <p id="profileBio">
        Passionate about coding and learning new technologies.
      </p>

      <div class="button-group">
        <button id="updateNameBtn">Update Name</button>
        <button id="updateRoleBtn">Update Role</button>
        <button id="toggleStatusBtn">Toggle Active Status</button>
        <button id="changeImageBtn">Change Image</button>
      </div>
    </div>

    <script src="week8_ex02_dom_profile_card.js"></script>
  </body>
</html>
